name: Refresh GitHub Pages data

on:
  workflow_dispatch:
  schedule:
    - cron: "0 23 * * 0-4"
    - cron: "0 4 * * 1-5"
    - cron: "0 9 * * 1-5"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Start local data service
        run: |
          HOST=127.0.0.1 PORT=4173 node server.js > /tmp/family-stock-server.log 2>&1 &
          echo $! > /tmp/family-stock-server.pid
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:4173/api/session && exit 0
            sleep 1
          done
          cat /tmp/family-stock-server.log
          exit 1

      - name: Refresh static snapshot
        run: |
          curl -fsS -c /tmp/family-stock-cookie.txt \
            -H 'Content-Type: application/json' \
            -d '{"password":"123456"}' \
            http://127.0.0.1:4173/api/login > /tmp/login.json

          curl -fsS -b /tmp/family-stock-cookie.txt \
            -H 'Content-Type: application/json' \
            -d '{"stockName":"皖能电力","stockCode":"000543","ownership":"watch","costPrice":"","position":"some","habit":"auto","allowT":false}' \
            http://127.0.0.1:4173/api/analyze > /tmp/family-stock-000543.json

          curl -fsS -b /tmp/family-stock-cookie.txt \
            -H 'Content-Type: application/json' \
            -d '{"stockName":"沃尔核材","stockCode":"002130","ownership":"watch","costPrice":"","position":"some","habit":"auto","allowT":false}' \
            http://127.0.0.1:4173/api/analyze > /tmp/family-stock-002130.json

          curl -fsS -b /tmp/family-stock-cookie.txt \
            -H 'Content-Type: application/json' \
            -d '{"stockName":"东方财富","stockCode":"300059","ownership":"watch","costPrice":"","position":"some","habit":"auto","allowT":false}' \
            http://127.0.0.1:4173/api/analyze > /tmp/family-stock-300059.json

          node - <<'NODE'
          const fs = require("fs");
          const files = [
            ["000543", "/tmp/family-stock-000543.json"],
            ["002130", "/tmp/family-stock-002130.json"],
            ["300059", "/tmp/family-stock-300059.json"]
          ];
          const analyses = {};
          for (const [code, file] of files) {
            const payload = JSON.parse(fs.readFileSync(file, "utf8"));
            if (!payload.ok || !payload.data) throw new Error(`analysis API failed for ${code}`);
            payload.data.meta.notice = `GitHub Pages 静态快照版：数据按最近一次自动任务刷新，不是打开页面时实时拉取。 ${payload.data.meta.notice || ""}`;
            analyses[code] = payload.data;
          }
          fs.writeFileSync("docs/data.json", JSON.stringify({
            defaultCode: "000543",
            generatedAt: analyses["000543"].meta.updatedAt,
            analyses
          }, null, 2));
          NODE

      - name: Stop local data service
        if: always()
        run: |
          if [ -f /tmp/family-stock-server.pid ]; then
            kill "$(cat /tmp/family-stock-server.pid)" || true
          fi

      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data.json
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "Refresh static market data"
            git push
          fi
